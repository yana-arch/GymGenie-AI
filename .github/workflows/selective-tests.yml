name: Test Suite with Selective Execution

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run smoke tests
        run: npm run test:smoke
      
      - name: Validate test tags
        run: npm run test:validate-tags || true  # Don't fail CI for validation

  critical-tests:
    name: Critical Tests (P0)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: smoke-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run critical tests
        run: npm run test:p0

  regression-tests:
    name: Regression Tests (P1-P3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    needs: critical-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run regression tests
        run: npm run test:regression

  full-tests:
    name: Full Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'pull_request'
    needs: [smoke-tests, critical-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run full test suite
        run: npm run test:full
      
      - name: Generate test coverage report
        run: npm run test:coverage-by-priority

  nightly-full:
    name: Nightly Full Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run full test suite with detailed reporting
        run: |
          npm run test:full
          npm run test:validate-tags
          npm run test:tag-report
      
      - name: Upload test reports
        uses: actions/upload-artifact@v3
        with:
          name: test-reports
          path: |
            test-tag-validation-report.json
            coverage/
          retention-days: 30

  performance-benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    needs: smoke-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run smoke test performance benchmarks
        run: |
          START=$(date +%s)
          npm run test:smoke
          END=$(date +%s)
          DURATION=$((END - START))
          echo "Smoke tests completed in ${DURATION} seconds"
          
          if [ $DURATION -gt 120 ]; then
            echo "::warning::Smoke tests exceeded 2-minute target (${DURATION}s)"
          fi
      
      - name: Run critical test performance benchmarks
        run: |
          START=$(date +%s)
          npm run test:p0
          END=$(date +%s)
          DURATION=$((END - START))
          echo "Critical tests completed in ${DURATION} seconds"
          
          if [ $DURATION -gt 300 ]; then
            echo "::warning::Critical tests exceeded 5-minute target (${DURATION}s)"
          fi